# Large multi-generation candidate run for retraining the shared playing policy.
# Output remains isolated from the live release; evaluate candidates before promotion.
# Use bot-training-deckbuilder.properties for deck-ranker-only runs.
training.mode=full
# training.deckbuilder.reference.manifest=path-to-distinct-reference-manifest.json

# Formats simulated and used to fit the shared in-game decision policy.
# All four are required to publish a release; each contributes examples to the policy.
training.formats=fotr_block,ttt_block,king_block,movie

# Total simulated training games per format in each generation. This profile collects
# 24,000 policy-training games across four formats and three generations. The
# random-baseline share contributes down-weighted policy decisions.
training.games.per.generation=2000
# Percentage of the per-format game budget spent with one policy bot against a random
# opponent (0-20). The policy bot's decisions contribute weighted examples; random
# opponent decisions are never recorded.
training.random.baseline.percent=5
training.random.baseline.example.weight=0.25
# Number of complete training cycles. Each cycle collects games, fits candidate models,
# and evaluates possible policy changes; rejected candidates do not replace the incumbent.
training.generations=3

# After one successful voluntary Fellowship transfer of an item, exclude subsequent
# voluntary transfers of that item in the same Fellowship phase. This can suppress
# a beneficial second transfer, so compare against the switch-off baseline.
training.transfer.guard.enabled=true
# The shared action-option model may override a phase-specific action with Pass
# when its Pass score exceeds every available action score. This is enabled only
# for the training experiment until a matched benchmark measures normal bot play.
training.action.pass.gate.enabled=true
# Cap bids only for controlled experiments; the default keeps the current legal
# maximum, and the engine-provided minimum is always respected.
training.bid.max.burdens=9
# Refuse to start if the isolated snapshot is missing or any policy/deck model
# cannot be loaded; do not silently run a fresh-policy experiment instead.
training.require.incumbent.models=true

# Auto uses the fresh schedule when no incumbent policy models are available and the
# refinement schedule otherwise. This controls training-time action exploration only;
# it does not clear the active models or persistent training examples.
training.exploration.profile=auto
training.exploration.fresh.start.percent=20
training.exploration.fresh.end.percent=5
training.exploration.refinement.start.percent=8
training.exploration.refinement.end.percent=2
training.exploration.decay.generations=10
# Randomly selected policy decisions are retained at this fraction of normal example weight.
training.exploration.example.weight=0.25

# Worker threads for game simulations. 0 uses all processors visible to the container;
# a positive value limits concurrent simulation work and CPU use.
training.cpu.threads=0

# Maximum number of decision-model fits run concurrently. Each fit loads training data,
# so increasing this can raise peak memory use; keep it within the JVM heap budget.
training.model.threads=2

# Maximum historical decision examples loaded per trainer, per format, for each fit.
# If a trainer's data exceeds this cap, use a deterministic sample stratified by
# decision type and normalized prompt, with reservoir sampling within each category.
# The category catalog is bounded by the cap; excess prompts share a type bucket.
# With compaction disabled the entire file is still read, but historical records are
# not replaced; the shared policy can use up to this many per trainer and format.
training.model.max.records.per.format=128000
# Experimental fit-only game/label balancing. Validation and stored examples keep
# their original weights; the isolated model directory prevents live promotion.
training.model.game-balanced-sampling=true
# New decision and deck-builder records are appended as gzip-compressed JSONL.
# Legacy uncompressed files are read alongside compressed appends and are not rewritten.
# Opt in to shared-v1 to store a relevant decision once for all matching trainers.
# Fitting still reads both layouts; shared files require repeated full-file scans.
training.data.layout=per-trainer
# Enable compaction only before compressed decision files exist; the loader refuses
# to compact them rather than overwrite or silently lose historical data.
training.data.compact.on.load=false

# Policy-evaluation budget per format and simulator argument position in each generation.
# It is divided by max.policy.changes; each of five candidates gets 100 games in each
# simulator argument position and format. Bidding still determines actual seats.
# The final frozen-opponent release benchmark is separate.
training.evaluation.games.per.seat=500
# Maximum individual decision-model changes evaluated per generation. The evaluation
# budget above is divided by this number; fewer available candidates do not increase
# the per-candidate share. A portion of the slots is reserved for challengers whose
# held-out match rate is slightly below the incumbent, then all must pass game gates.
training.evaluation.max.policy.changes=5
training.evaluation.exploratory.changes=2
training.evaluation.max.validation.regression=3.0
# Seed for repeatable evaluation deck-pair selection (with generation/format/change
# offsets). It does not seed card draws or other randomness within the games.
training.evaluation.seed=1

# Number of legal candidate decks generated and evaluated per format in each generation.
# Their outcomes are used to fit the separate deck-ranking model, not the in-game policy.
training.deckbuilder.candidates.per.generation=32
# Complete games played for each candidate deck during deck-builder evaluation.
# Must be an even number of at least 2 so the candidate uses both simulator argument positions.
training.deckbuilder.games.per.candidate=24
# Cap the deterministic historical example sample used to fit each deck ranker.
# Every outcome from the current generation is retained in addition to this sample;
# the append-only historical outcome files are never compacted or overwritten.
training.deckbuilder.max.history.records=10000

# Minimum percent of recorded decisions a newly fitted model must match on held-out
# examples. Validation holds out whole games that were not used to fit the model.
# Below this threshold the candidate is not considered; 0 disables this minimum only,
# not the later incumbent comparison or candidate-vs-incumbent game evaluation (0-100).
training.models.minimum.validation.accuracy=0

# Console progress reporting interval, measured in completed games or model-training
# tasks. This changes reporting frequency, not the amount of training or evaluation.
training.progress.interval.games=100

# Read-only local training dashboard and JSON API bind address. Use 127.0.0.1 for
# local-only access; set the port to 0 to disable the dashboard server.
training.dashboard.host=127.0.0.1
training.dashboard.port=8765

# Directory for one structured, append-only JSONL metrics file per run, relative to
# this properties file. Includes progress, evaluation results, and training events.
training.metrics.directory=bot-training-runs
# Hash the full starting JSONL corpus so this large candidate run can be compared
# against a matching model, corpus and holdout snapshot. This streams every data file.
training.metrics.input.fingerprints.enabled=true

# Filesystem paths relative to this properties file (and mounted into the training
# container). Models are built in a hidden staging workspace and replace the active
# release only after every format finishes successfully.
# Isolated experimental release, seeded from the current models. Training publishes
# here, not to the live bot-models directory. Evaluate before any manual promotion.
models.directory=bot-training-runs/transfer-guard-experiment-models
# Persistent training examples. Per-format decision examples and deck-builder outcomes
# are stored here; whole-game decision records use a versioned subdirectory.
training.data.directory=bot-training-data
# Reserve generated decks from this manifest: future policy fitting excludes games
# using any reserved deck and legacy decision rows without deck fingerprints.
training.holdout.deck.manifest=bot-benchmarks/reference-decks-v1.json
# Root of the card, format, sealed, and product resources needed to build and simulate games.
cards.resources.directory=gemp-lotr-cards/src/main/resources
