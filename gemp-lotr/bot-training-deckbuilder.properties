# Large deck-ranker candidate run. Settings entered in the local UI override this
# file for that run only; --headless uses these values unchanged.
training.mode=deck-builder-only
training.formats=fotr_block,ttt_block,king_block,movie
training.generations=4
training.deckbuilder.candidates.per.generation=40
training.deckbuilder.games.per.candidate=32
# 20,480 candidate games across four formats and four generations.
training.deckbuilder.max.history.records=10000
training.cpu.threads=0
# Generate this independent training pool once; it must not overlap the holdout below.
training.deckbuilder.reference.manifest=bot-benchmarks/deck-builder-training-references-v1.json
training.holdout.deck.manifest=bot-benchmarks/reference-decks-v1.json
training.require.incumbent.models=true
# Share the isolated candidate snapshot and full corpus with bot-training.properties.
# Workspace locks require the full-policy and deck-only jobs to run sequentially.
training.data.directory=bot-training-data
training.metrics.directory=bot-training-runs/deck-builder-only-metrics
training.metrics.input.fingerprints.enabled=true
models.directory=bot-training-runs/transfer-guard-experiment-models
cards.resources.directory=gemp-lotr-cards/src/main/resources
training.dashboard.host=127.0.0.1
training.dashboard.port=8766
training.progress.interval.games=100
